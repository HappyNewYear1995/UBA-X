# UBA-X on dedicated server 121.40.98.140 (80/443 are free here; no sibling site).
# Serves on 80 (primary, security-group open) and 8888 (compat).
# After DNS for ubax.huanniankj.com is repointed to 121.40.98.140, run:
#   certbot --nginx -d ubax.huanniankj.com
# to add the 443/SSL block + HTTPS redirect.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 8888;
    listen [::]:8888;
    server_name _;

    root /opt/ubax/web/dist;
    index index.html;

    client_max_body_size 8m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location = /health { proxy_pass http://127.0.0.1:8081/health; }

    location /sdk/  { proxy_pass http://127.0.0.1:8081; proxy_set_header Host $host; }
    location /demo/ { proxy_pass http://127.0.0.1:8081; proxy_set_header Host $host; }

    location / { try_files $uri $uri/ /index.html; }

    location /assets/ { try_files $uri =404; expires 7d; add_header Cache-Control "public"; }
}
