# UBA-X on dedicated server 121.40.98.140 (80/443 free here; no sibling site).
# server_name is set so `certbot --nginx -d ubax.huanniankj.com` attaches cleanly
# once DNS for the domain is repointed to this box. default_server keeps direct-IP
# access (http://121.40.98.140/) working too. 8888 retained for compatibility.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 8888;
    listen [::]:8888;
    server_name ubax.huanniankj.com;

    root /opt/ubax/web/dist;
    index index.html;

    client_max_body_size 8m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location = /health { proxy_pass http://127.0.0.1:8081/health; }

    location /sdk/  { proxy_pass http://127.0.0.1:8081; proxy_set_header Host $host; }
    location /demo/ { proxy_pass http://127.0.0.1:8081; proxy_set_header Host $host; }

    # ACME HTTP-01 challenge for certbot
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { try_files $uri $uri/ /index.html; }

    location /assets/ { try_files $uri =404; expires 7d; add_header Cache-Control "public"; }
}
